<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>学习陪伴 · 家长</title>
<meta name="theme-color" content="#e3dbce">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="apple-touch-icon.png" sizes="180x180" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
try {
  const isEmbed = window.parent !== window && new URLSearchParams(location.search).get('embed') === '1';
  if (isEmbed) document.documentElement.dataset.embed = '1';
  const t = localStorage.getItem(isEmbed ? 'ts-theme' : 'study-theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --page: #e3dbce;
  --surface: #f6f2ea;
  --ink: #18191b;
  --ink-2: #46484d;
  --muted: #5a5c61;
  --grid: #d6cdbf;
  --axis: #c3b9aa;
  --ring: rgba(24,25,27,0.10);
  --card-ring: #d6cdbf;
  --accent: #0b7470;
  --accent-ink: #faf8f4;
  --series: #0b7470;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --absent: #b8ae9f;
  --empty: #e8e1d5;
  --hover: rgba(24,25,27,0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0a101c;
    --surface: #121a2b;
    --ink: #f2f5fb;
    --ink-2: #b4bfd4;
    --muted: #8a96ad;
    --grid: #232e45;
    --axis: #3a465e;
    --ring: rgba(255,255,255,0.10);
    --card-ring: transparent;
    --accent: #5ab8ff;
    --accent-ink: #0a101c;
    --series: #5ab8ff;
    --absent: #55627c;
    --empty: #1d2840;
    --hover: rgba(255,255,255,0.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0a101c; --surface: #121a2b; --ink: #f2f5fb; --ink-2: #b4bfd4; --muted: #8a96ad;
  --grid: #232e45; --axis: #3a465e; --ring: rgba(255,255,255,0.10); --card-ring: transparent; --accent: #5ab8ff; --accent-ink: #0a101c;
  --series: #5ab8ff; --absent: #55627c; --empty: #1d2840; --hover: rgba(255,255,255,0.06);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: .01em; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
.card {
  background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring);
  padding: 16px; margin-top: 12px;
}
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top .title { flex: 1 1 auto; min-width: 0; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2);
  padding: 2px 10px 2px 8px; border-radius: 999px; box-shadow: 0 0 0 1px var(--ring); vertical-align: 2px;
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--absent); display: inline-block; }
.pill.on i { background: var(--good); }
button {
  font: inherit; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: transform .14s cubic-bezier(.22,1,.36,1), background-color .14s ease, opacity .12s ease;
}
button:active:not(:disabled) { transform: scale(.96); transition: transform .05s ease-out, background-color .05s ease; }
input, summary, .cell.has, .col { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.actions { display: flex; align-items: center; gap: 8px; }
.theme {
  display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px;
  box-shadow: inset 0 0 0 1px var(--ring);
}
.theme button {
  background: transparent; color: var(--ink-2); padding: 6px 8px; border-radius: 9px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 4px; font-size: 13px; line-height: 1;
}
.theme button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme button[aria-pressed="true"] { background: var(--empty); color: var(--ink); font-weight: 600; }
button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ring); font-weight: 500; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, .cell:focus-visible, .col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.datebar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.datebar button { padding: 6px 12px; }
.datebar input {
  font: inherit; color: var(--ink); background: var(--surface); border: 0; border-radius: 10px;
  box-shadow: inset 0 0 0 1px var(--ring); padding: 6px 10px; min-width: 0;
}
.datebar .lbl { color: var(--ink-2); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.tile { background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring); padding: 14px 16px; }
.tile .k { color: var(--ink-2); font-size: 13px; }
.tile .v { font-size: 26px; font-weight: 650; margin-top: 2px; line-height: 1.2; }
.tile .v small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.tile .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend b.rem { background: transparent; box-shadow: inset 0 0 0 2px var(--ink); }
.hours { display: grid; grid-template-columns: 38px 1fr; gap: 4px 8px; align-items: center; }
.hours .h { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: repeat(60, 1fr); gap: 1px; contain: content; }
.cell { height: 20px; border-radius: 2px; background: var(--empty); }
.cell.has { cursor: pointer; }
.cell.rem { box-shadow: inset 0 0 0 2px var(--ink); }
.ticks { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: center; }
.bars .n { font-size: 14px; }
.bars .track { height: 14px; position: relative; }
.bars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .val { font-size: 13px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > .card { margin-top: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--grid); font-size: 14px; contain: content; content-visibility: auto; contain-intrinsic-size: auto 42px; }
.list li:first-child { border-top: 0; }
.list li.empty { display: block; }
.list .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.list .tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.list .tag i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.list .note { color: var(--ink-2); }
.list .ev { color: var(--ink-2); }
details summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "展开"; color: var(--accent); font-weight: 500; font-size: 13px; }
details[open] summary::after { content: "收起"; }
details[open] summary { margin-bottom: 8px; }
/* Brief entrances keep the report calm after loading; no continuous animation. */
@keyframes studyReveal { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.top, .tile, .card { animation: studyReveal .36s cubic-bezier(.2,.8,.25,1) backwards; }
.tile:nth-child(2) { animation-delay: .04s; }.tile:nth-child(3) { animation-delay: .08s; }.tile:nth-child(4) { animation-delay: .12s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .bar { fill: var(--series); }
.chart .col { cursor: pointer; }
.chart .col:hover .hit, .chart .col.sel .hit { fill: var(--hover); }
.chart .col .hit { fill: transparent; }
.chart text.vl { fill: var(--ink-2); font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 8px; }
th, td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 500; border-top: 0; }
#tip {
  position: fixed; z-index: 10; pointer-events: none; max-width: 260px; display: none;
  background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px;
  box-shadow: 0 0 0 1px var(--ring), 0 8px 24px rgba(0,0,0,.18); font-size: 13px;
}
#tip .tv { font-weight: 650; font-size: 14px; display: flex; align-items: center; gap: 6px; }
#tip .tv i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
#tip .tn { color: var(--ink-2); margin-top: 2px; }
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--page); padding: 8px 16px; border-radius: 999px; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: 1; }
.foot { color: var(--muted); font-size: 12px; margin-top: 16px; line-height: 1.7; }
.stale { opacity: .55; transition: opacity .15s; }
@media (max-width: 720px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .tile .v { font-size: 22px; }
  .cell { height: 16px; }
  .row { gap: 0.5px; }
}
/* ===== 2026-11-13 (Claude): the home screen's look — its colours (in the tokens above), rounder cards, larger buttons ===== */
.card, .tile { border-radius: 20px; box-shadow: 0 0 0 1px var(--card-ring); }
h1 { font-weight: 700; }
button { border-radius: 14px; min-height: 44px; }
button.ghost { box-shadow: none; background: var(--empty); }
.pill { box-shadow: none; background: var(--empty); padding: 3px 12px 3px 10px; }
.theme { padding: 4px; border-radius: 16px; background: var(--empty); box-shadow: none; }
.theme button { min-height: 36px; padding: 6px 10px; border-radius: 12px; }
.theme button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.datebar button { min-height: 40px; }
.datebar input { min-height: 40px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--card-ring); background: var(--surface); }
#tip { border-radius: 14px; }

/* ===== 2026-11-18 Claude：选中态和其他手机页一样（浅底 + 描边 + 深色字）；小字不小于 13px，按钮够大 ===== */
:root { --sel-soft: #c7dfda; --sel-ink: #0b6864; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sel-soft: #17243a; --sel-ink: #a9dcff; } }
:root[data-theme="dark"] { --sel-soft: #17243a; --sel-ink: #a9dcff; }
.theme button { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.theme button[aria-pressed="true"] { background: var(--sel-soft); color: var(--sel-ink); box-shadow: inset 0 0 0 2px var(--accent); }
#toggle { min-height: 44px; }
.datebar button { min-width: 44px; min-height: 44px; font-size: 20px; }
.datebar input { min-height: 44px; }
.datebar .lbl, .sub { font-size: 14px; }
.tile .k { font-size: 14px; }
.tile .d { font-size: 13px; }
.legend { font-size: 13px; }
.foot { font-size: 13px; }
details summary::after { font-size: 14px; }
/* ===== 2026-11-18 Claude 第四轮：适配——320 宽的小屏上「浅色 / 深色 / 自动」和「开启陪伴」不再被挤成竖排 ===== */
.theme button, .actions > button { white-space: nowrap; }
@media (max-width: 340px) {
  .theme button svg { display: none; }
  .theme button { padding: 6px 9px; }
  .actions { gap: 6px; }
}
/* ===== 2026-11-18 Claude 第五轮：iPhone 上点日期框不再把整页放大（输入框字号要 16px）；横屏时内容不进刘海区 ===== */
.datebar input { font-size: 16px; }
.wrap { padding-top: max(16px, env(safe-area-inset-top)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
/* ===== 2026-11-20 Claude：嵌在管理后台里 ===== */
html[data-embed] .theme { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">
      <h1>学习陪伴 <span class="pill" id="pill"><i></i><span id="pillText">读取中</span></span></h1>
      <div class="sub" id="stateSub">&nbsp;</div>
    </div>
    <div class="actions">
      <div class="theme" role="group" aria-label="深浅色">
        <button type="button" data-t="light" aria-pressed="false" title="浅色"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>浅色</button>
        <button type="button" data-t="dark" aria-pressed="false" title="深色"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>深色</button>
        <button type="button" data-t="auto" aria-pressed="false" title="跟随手机或电脑的设置">自动</button>
      </div>
      <button id="toggle" disabled>…</button>
    </div>
  </div>

  <div class="datebar">
    <button class="ghost" id="prev" aria-label="前一天" disabled>‹</button>
    <input type="date" id="date" aria-label="选择日期" disabled>
    <button class="ghost" id="next" aria-label="后一天" disabled>›</button>
    <span class="lbl" id="dateLbl"></span>
  </div>

  <p id="dayError" hidden role="status">读取失败：灰色区域仍显示上次数据，请重试。</p>
  <div id="dayArea">
    <div class="tiles">
      <div class="tile"><div class="k">估算在座时长</div><div class="v" id="tMin">–</div><div class="d" id="tSpan">&nbsp;</div></div>
      <div class="tile"><div class="k">专注采样率</div><div class="v" id="tFocus">–</div><div class="d" id="tFocusD">&nbsp;</div></div>
      <div class="tile"><div class="k">语音提醒</div><div class="v" id="tRem">–</div><div class="d" id="tRemD">&nbsp;</div></div>
      <div class="tile"><div class="k">最常见的问题</div><div class="v" id="tTop">–</div><div class="d" id="tTopD">&nbsp;</div></div>
    </div>

    <div class="card">
      <h2>每分钟状态</h2>
      <div class="legend" id="legend"></div>
      <div id="hours"></div>
    </div>

    <div class="grid2" style="margin-top:12px">
      <div class="card">
        <h2>发现的问题</h2>
        <div id="issues"></div>
      </div>
      <div class="card">
        <h2>提醒记录</h2>
        <ul class="list" id="reminders"></ul>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>近 14 天估算在座时长</h2>
    <div id="trend"></div>
    <details style="margin-top:12px">
      <summary>表格</summary>
      <div id="trendTable"></div>
    </details>
  </div>

  <div class="card" id="detailCard">
    <details id="detailBox">
      <summary>当天全部记录</summary>
      <ul class="list" id="detail"></ul>
    </details>
  </div>

  <div class="foot" id="foot">按有效自动采样估算在座时长，并非精确计时；无法判断和手动检查不计入。照片不保存，文字记录保留 30 天。</div>
</div>
<div id="tip" role="status"></div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const STATES = [
  ['good', '专注学习', 'var(--good)'],
  ['posture', '坐姿 / 离太近', 'var(--warning)'],
  ['drift', '走神', 'var(--serious)'],
  ['distract', '玩手机 / 玩东西 / 犯困', 'var(--critical)'],
  ['absent', '不在座位', 'var(--absent)'],
  ['unknown', '无法判断', '#8999bb'],
];
const STATE = Object.fromEntries(STATES.map(s => [s[0], s]));
const ISSUE = { phone: '玩手机/平板', playing: '玩东西', sleep: '犯困', focus: '走神', posture: '坐姿', eyes: '离太近' };
const ISSUE_ORDER = ['phone', 'playing', 'sleep', 'focus', 'posture', 'eyes'];
const ACT = { studying: '写作业', reading: '看书', phone: '玩手机/平板', playing: '玩东西', daydreaming: '发呆',
              sleeping: '犯困', absent: '不在座位', other: '其他' };
const POSTURE = { good: '坐姿端正', slouch: '驼背', lying: '趴着', tilted: '身体歪', unknown: '看不清' };
const SKIP = { model_result: '画面不清楚或模型结果无效', incomplete_burst: '连拍画面不完整', orientation_changed: '设备转动中，暂不判断', disabled: '已关闭陪伴', lens_cover: '镜头盖合上了', no_frame: '没拍到画面', call_or_mirroring: '正在通话或投屏' };
const BY = { home: '设备主页按钮', parent: '家长后台', auto_off: '开满时长自动', focus: '番茄专注', restart: '重新计时' };
const WEEK = '日一二三四五六';

let state = null, today = null, viewDate = null, timer = null, busy = false, refreshing = false, dayRequest = 0, switchVersion = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function fmtMin(m) {
  if (m > 0 && m < 1) return ['不足 1', '分钟'];
  m = Math.round(m);
  if (m < 60) return [m, '分钟'];
  return [Math.floor(m / 60) + ' 小时 ' + (m % 60), '分'];
}
function setVal(node, parts) {
  node.textContent = parts[0];
  if (parts[1]) { const s = el('small', null, parts[1]); node.appendChild(s); }
}
const HM_FMT = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false});
function hm(ts) { return HM_FMT.format(new Date(ts*1000)); }
function addDays(iso, n) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
let _ydayFor = null, _ydayIso = '';
function dayLabel(iso) {
  if (today && today !== _ydayFor) { _ydayFor = today; _ydayIso = addDays(today, -1); }
  const d = new Date(iso + 'T12:00:00');
  const rel = iso === today ? '今天' : iso === _ydayIso ? '昨天' : '';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + WEEK[d.getDay()] + (rel ? ' · ' + rel : '');
}
function issuesOf(e) {
  if (!e || !e.present || e.activity === 'absent') return [];
  const out = [];
  if (e.activity === 'sleeping') out.push('sleep');
  if (e.activity === 'phone') out.push('phone');
  if (e.activity === 'playing') out.push('playing');
  if (e.too_close) out.push('eyes');
  if (e.posture === 'slouch' || e.posture === 'lying' || e.posture === 'tilted') out.push('posture');
  if (e.activity === 'daydreaming' || (e.focused === false && e.activity !== 'studying' && e.activity !== 'reading')) out.push('focus');
  return out;
}

      if (ev.pointerType !== 'mouse' && !wasSel) { show(); return; }

    });
    svg.appendChild(g);
  });
  box.appendChild(svg);

  if (data !== lastTrendTableData || today !== lastTrendTableDay) {
    lastTrendTableData = data;
    lastTrendTableDay = today;
    const t = el('table'), head = el('tr');
    ['日期', '估算在座时长', '专注采样率', '提醒'].forEach(h => head.appendChild(el('th', null, h)));
    t.appendChild(head);
    days.slice().reverse().forEach((d, i) => {
      const tr = el('tr'), v = d.present_seconds / 60, remN = Object.values(d.reminders).reduce((a, b) => a + b, 0);
      const durTxt = v ? fmtMin(v).join(' ') : ((d.focus_sessions || d.focus_minutes) ? ('番茄 ' + (d.focus_minutes || 0) + 'm') : '–');
      tr.append(el('td', null, dayLabel(d.date)), el('td', null, durTxt),
        el('td', null, d.present ? Math.round(d.focused / d.present * 100) + '%' : '–'), el('td', null, d.present ? remN + ' 次' : '–'));
      t.appendChild(tr);
    });
    $('trendTable').replaceChildren(t);
  }
}

/* ---------- loading ---------- */
let lastDaySig = '', lastDayObj = null, lastDayDate = '', lastTrendSig = '', lastTrendObj = null, lastTrendDate = '';
async function loadDay(date, quiet) {
  if (!quiet) hideTip();
  const version = ++dayRequest;
  viewDate = date;
  $('date').value = date; $('dateLbl').textContent = dayLabel(date);
  $('next').disabled = date >= today; $('prev').disabled = date <= addDays(today, -29);
  if (!quiet) { $('dayArea').classList.add('stale'); $('detailCard')?.classList.add('stale'); }
  $('dayError').hidden = true;
  try {
    const day = await getJSON('api/parent/day?date=' + encodeURIComponent(date));
    if (version !== dayRequest || viewDate !== date) return;
    if (!quiet || day !== lastDayObj || date !== lastDayDate) {
      const sig = date + ':' + JSON.stringify(day);
      lastDayObj = day; lastDayDate = date;
      if (!quiet || sig !== lastDaySig) { lastDaySig = sig; renderDay(day); }
    }
    $('dayArea').classList.remove('stale'); $('detailCard')?.classList.remove('stale');
  } catch (e) {
    if (version === dayRequest) { $('dayArea').classList.add('stale'); $('detailCard')?.classList.add('stale'); $('dayError').hidden = false; if (!quiet) toast('读取失败，灰色区域仍为上次数据'); }
  }
}
async function refresh(first) {
  if (!first && _isHiddenEmbed()) return;
  if (refreshing || busy) return;
  refreshing = true;
  const version = switchVersion;
  try {
    const trendFetch = getJSON('api/parent/days?n=14').catch(() => null);
    const fresh = await getJSON('api/parent/state');
    if (version !== switchVersion || busy) return;
    const oldToday = today, dayChanged = today && today !== fresh.today;
    state = fresh; today = state.today;
    $('date').disabled = false; $('date').max = today; $('date').min = addDays(today, -29);
    renderState();
    let dayJob = null;
    const minDate = addDays(today, -29);
    if (!viewDate || (dayChanged && (viewDate === oldToday || viewDate > today)) || viewDate === today) dayJob = loadDay(today, !first && !dayChanged && viewDate === today);
    else if (dayChanged && viewDate < minDate) dayJob = loadDay(minDate, false);
    else {
      if (dayChanged) { $('dateLbl').textContent = dayLabel(viewDate); $('next').disabled = viewDate >= today; $('prev').disabled = viewDate <= minDate; }
      if (!$('dayError').hidden) dayJob = loadDay(viewDate, true);
    }
    const trendJob = trendFetch.then(trend => {
      if (!trend || version !== switchVersion) return;
      if (first || dayChanged || trend !== lastTrendObj || today !== lastTrendDate) {
        const sig = today + ':' + JSON.stringify(trend);
        lastTrendObj = trend; lastTrendDate = today;
        if (first || dayChanged || sig !== lastTrendSig) { lastTrendSig = sig; renderTrend(trend); }
      }
    });
    await Promise.all([dayJob, trendJob]);
  } catch (e) {
    if (version === switchVersion) {
      $('pill').classList.remove('on');
      $('pillText').textContent = '连不上设备'; $('toggle').disabled = true; if (!state) $('toggle').textContent = '暂不可用';
      $('stateSub').textContent = '请检查设备网络，以及当前 WiFi 或 VPN 连接';
    }
  } finally { refreshing = false; }
}
$('prev').addEventListener('click', () => { if (viewDate && today && viewDate > addDays(today, -29)) loadDay(addDays(viewDate, -1)); });
$('next').addEventListener('click', () => { if (viewDate && today && viewDate < today) loadDay(addDays(viewDate, 1)); });
$('date').addEventListener('change', () => { const v = $('date').value; if (v === viewDate) return; if (v && today && v <= today && v >= addDays(today, -29)) loadDay(v); else if (viewDate) $('date').value = viewDate; });
let rw; window.addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { const cw = $('trend').clientWidth; const wasZero = lastTrendW === 0; if (lastTrend && cw > 0 && cw !== lastTrendW) renderTrend(lastTrend); if (cw > 0 && wasZero) { refresh(false); syncPollTimer(); } }, 200); });
let embedActive = true;
function _isHiddenEmbed() { return document.documentElement.dataset.embed === '1' && (!embedActive || window.innerWidth === 0); }
function syncPollTimer() {
  if (!document.hidden && !_isHiddenEmbed()) { if (!timer) timer = setInterval(() => { if (!document.hidden && !_isHiddenEmbed()) refresh(false); }, 30000); }
  else if (timer) { clearInterval(timer); timer = null; }
}
window.tsEmbedSetActive = active => {
  embedActive = !!active;
  if (!embedActive) {
    hideTip();
    if (timer) { clearInterval(timer); timer = null; }
  } else if (!document.hidden) {
    refresh(false);
    syncPollTimer();
  }
};
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !_isHiddenEmbed()) { if (timer) { clearInterval(timer); timer = null; } refresh(false); }
  syncPollTimer();
});
window.addEventListener('pagehide', () => { if (timer) { clearInterval(timer); timer = null; } });
window.addEventListener('pageshow', (ev) => {
  if (ev.persisted && !document.hidden && !_isHiddenEmbed()) { if (timer) { clearInterval(timer); timer = null; } refresh(false); syncPollTimer(); }
});
renderLegend();
refresh(true);
syncPollTimer();
</script>
