<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk 测试页</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #e8eef4;
    font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  #clock { font-size: 96px; font-weight: 300; letter-spacing: 2px; }
  #date { font-size: 28px; opacity: .7; }
  p { font-size: 20px; opacity: .6; margin: 0; }
  button { font-size: 24px; padding: 16px 40px; border-radius: 12px; border: 0;
    background: #2f6fed; color: #fff; }
  #taps { font-size: 22px; }
</style>
</head>
<body>
  <div id="clock">--:--:--</div>
  <div id="date"></div>
  <button id="tap">点我测试触摸</button>
  <div id="taps">已点击 0 次</div>
  <p>kiosk 模式运行中 · 用 sudo kiosk-mode url &lt;网址&gt; 更换页面</p>
<script>
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    document.getElementById('date').textContent = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  }
  tick(); setInterval(tick, 1000);
  let n = 0;
  document.getElementById('tap').addEventListener('click', () => {
    document.getElementById('taps').textContent = `已点击 ${++n} 次`;
  });
</script>
</body>
</html>
