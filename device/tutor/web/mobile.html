<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e3dbce" id="metaThemeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI拍题">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI 手机拍题讲题</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="apple-touch-icon.png" sizes="180x180" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* 2026-11-20 Claude：管理后台（/admin/）嵌入本页时，深浅色由后台统一切换 */
try { if (window.parent !== window && new URLSearchParams(location.search).get('embed') === '1') document.documentElement.dataset.embed = '1'; } catch (e) {}
(function() {
  try {
    var saved = localStorage.getItem('tutor-mob-theme') || 'auto';
    var dark = saved === 'dark' || (saved === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.getElementById('metaThemeColor');
    if (m) m.setAttribute('content', dark ? '#0a101c' : '#e3dbce');
  } catch (e) {}
})();
</script>
<style>
:root, html[data-theme="light"] {
  --bg: #e3dbce;
  --panel: #f6f2ea;
  --panel-2: #e8e1d5;
  --line: #d4cab9;
  --text: #18191b;
  --muted: #4a4d55;
  --dim: #6e727b;
  --accent: #0b7470;
  --accent-ink: #faf8f4;
  --amber: #9c5b08;
  --amber-bg: #fdf4e2;
  --aux: #d63336;
  --ok-bg: #d4eae3;
}
html[data-theme="dark"] {
  --bg: #0b1322;
  --panel: #131e33;
  --panel-2: #1b2944;
  --line: #283a5a;
  --text: #eef3fb;
  --muted: #a6b4cc;
  --dim: #7686a3;
  --accent: #22d68a;
  --accent-ink: #062115;
  --amber: #f5c04a;
  --amber-bg: #241d10;
  --aux: #ff6b6b;
  --ok-bg: #142c22;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-weight: 400; overflow-x: hidden;
}
button, input, select { font-family: inherit; touch-action: manipulation; }
.wrap {
  max-width: 540px; margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
.hdr {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.hdr-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo-badge {
  width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0;
}
.hdr-title { font-size: 18px; line-height: 22px; font-weight: 700; white-space: nowrap; }
.hdr-sub { font-size: 12px; line-height: 16px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; flex-shrink: 0; }
.dot.ok { background: var(--accent); }
.hdr-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.mini-link, .theme-btn {
  height: 32px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font-size: 12px; line-height: 30px; font-weight: 700;
  text-decoration: none; cursor: pointer; white-space: nowrap;
}

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 13px; display: flex; flex-direction: column; gap: 10px;
}
.card-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-hd b { font-size: 15px; line-height: 20px; font-weight: 700; }
.badge-pill {
  height: 24px; padding: 0 8px; border-radius: 7px; background: var(--ok-bg); color: var(--accent);
  border: 1px solid var(--accent); font-size: 12px; line-height: 22px; font-weight: 700; white-space: nowrap;
}

.pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pick-btn {
  height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel-2);
  color: var(--text); font-size: 15px; line-height: 20px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; position: relative;
}
.pick-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick-btn:active { opacity: 0.86; }
.pick-btn input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.paste-btn {
  height: 38px; border-radius: 11px; border: 1px dashed var(--line); background: var(--panel-2);
  color: var(--muted); font-size: 13px; line-height: 36px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; width: 100%;
}
.paste-btn:active { opacity: 0.85; }
.tray-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tray-pill {
  height: 28px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font-size: 12px; line-height: 26px; font-weight: 700; cursor: pointer;
}
.tray-pill.on { border-color: var(--accent); background: var(--ok-bg); color: var(--accent); }

.reuse-bar {
  display: none; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 11px; border-radius: 11px; background: var(--amber-bg); border: 1px solid var(--amber);
  font-size: 13px; line-height: 18px; color: var(--text);
}
.reuse-bar.show { display: flex; }
.reuse-btn {
  height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--amber);
  background: var(--panel); color: var(--amber); font-size: 12px; line-height: 28px; font-weight: 700;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}

.crop-section { display: none; flex-direction: column; gap: 10px; }
.crop-section.show { display: flex; }
.stage-box {
  width: 100%; height: 320px; border-radius: 14px; background: #141923; border: 1px solid var(--line);
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
  touch-action: none; user-select: none;
}
html[data-theme="light"] .stage-box { background: #dad2c4; }
#pagePreviewCanvas { display: block; max-width: 100%; max-height: 100%; }
.crop-layer { position: absolute; pointer-events: auto; touch-action: none; }
.crop-win {
  position: absolute; border: 2px solid #22d68a; border-radius: 6px;
  box-shadow: 0 0 0 1600px rgba(0, 0, 0, 0.44); background: rgba(34, 214, 138, 0.06);
}
.crop-lbl {
  position: absolute; top: -24px; left: 0; height: 21px; padding: 0 7px; border-radius: 5px;
  background: #22d68a; color: #062115; font-size: 12px; line-height: 21px; font-weight: 700; white-space: nowrap;
}
.c-hdl {
  position: absolute; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
}
.c-hdl::after {
  content: ""; width: 12px; height: 12px; border-radius: 3px; background: #22d68a; border: 2px solid #062115;
}
.c-hdl.nw { left: -16px; top: -16px; }
.c-hdl.ne { right: -16px; top: -16px; }
.c-hdl.sw { left: -16px; bottom: -16px; }
.c-hdl.se { right: -16px; bottom: -16px; }
.done-mark {
  position: absolute; border: 1px dashed #0b7470; border-radius: 5px;
  background: rgba(11, 116, 112, 0.12); pointer-events: none;
}
html[data-theme="dark"] .done-mark { border-color: #22d68a; background: rgba(34, 214, 138, 0.12); }
.done-mark span {
  position: absolute; right: 2px; top: 2px; height: 18px; padding: 0 5px; border-radius: 4px;
  background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 18px; font-weight: 700;
}

.tool-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.t-chip {
  height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font-size: 13px; line-height: 32px; font-weight: 700;
  cursor: pointer; white-space: nowrap; flex: 1; text-align: center;
}
.t-chip.on { border-color: var(--accent); background: var(--ok-bg); color: var(--accent); }

.crop-live-card {
  padding: 8px 10px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px;
}
.crop-live-hd {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  font-size: 12px; line-height: 16px; color: var(--muted);
}
.crop-live-hd b { color: var(--text); font-weight: 700; }
.crop-live-wrap {
  width: 100%; max-height: 118px; border-radius: 8px; background: #fcf9f2; border: 1px solid var(--line);
  overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 4px;
}
#cropLiveCanvas { max-width: 100%; max-height: 108px; display: block; }

.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sel-ctl {
  height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font-size: 13px; font-weight: 700; width: 100%;
}
.note-inp {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font-size: 14px;
}
.note-inp::placeholder { color: var(--dim); }

.act-col { display: flex; flex-direction: column; gap: 9px; margin-top: 2px; }
.btn-explain {
  height: 50px; border-radius: 13px; border: none; background: var(--accent); color: var(--accent-ink);
  font-size: 16px; line-height: 22px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-stage {
  height: 44px; border-radius: 12px; border: 2px solid var(--amber); background: var(--amber-bg);
  color: var(--amber); font-size: 14px; line-height: 20px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-explain:disabled, .btn-stage:disabled { opacity: 0.52; cursor: default; }

.live-box { display: flex; flex-direction: column; gap: 7px; }
.live-q {
  padding: 9px 11px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
  font-size: 13px; line-height: 19px; color: var(--text);
}
.live-meta { font-size: 12px; line-height: 18px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.live-acts { display: none; align-items: center; gap: 7px; flex-wrap: wrap; }
.live-acts.show { display: flex; }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: 480px; margin: 0 auto; padding: 11px 15px; border-radius: 12px;
  background: #18191b; color: #faf8f4; border: 2px solid var(--accent);
  font-size: 14px; line-height: 20px; font-weight: 700; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .16s ease; z-index: 60;
}
.toast.show { opacity: 1; }

/* ===== 2026-11-18 Claude：和手机对讲页一套样子——深色用主页的底色和蓝色强调，顶栏同样的图标按钮，图标代替表情，字不小于 13px ===== */
html[data-theme="dark"] { --bg: #0a101c; --panel: #121a2b; --panel-2: #1d2840; --line: #232e45; --text: #f2f5fb; --muted: #b4bfd4; --dim: #8a96ad;
  --accent: #5ab8ff; --accent-ink: #0a101c; --ok-bg: #17243a; }
svg.mi { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -4px; }
.logo-badge { display: none; }
.hdr-title { font-size: 20px; line-height: 26px; }
.hdr-sub { font-size: 13px; line-height: 18px; }
.mini-link, .theme-btn { height: 44px; min-width: 44px; padding: 0 12px; border-radius: 14px; border: none; background: var(--panel);
  font-size: 14px; line-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.theme-btn { width: 44px; padding: 0; }
.card-hd b { font-size: 16px; }
.live-meta, .live-meta span { font-size: 13px; }
.paste-btn, .sel-ctl { min-height: 44px; }
/* ===== 2026-11-18 Claude 第二轮：「家里大屏现在」里的按钮恢复成正常文字按钮（第一轮把它们和顶栏图标按钮一起限成了 44px 宽），
   框题工具、作业夹页码换成线条图标，按钮 40–44px、字不小于 13px ===== */
.theme-btn { width: auto; padding: 0 12px; }
#btnTheme { width: 44px; padding: 0; }
.card-hd #btnNextSamePage { height: 40px; padding: 0 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 14px; flex-shrink: 0; }
.live-acts.show { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#liveStageActs #liveTrayPills { grid-column: 1 / -1; }
#liveStageActs #liveTrayPills:empty { display: none; }
#liveStageActs .theme-btn { width: 100%; height: 44px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 14px; }
#liveStageActs #btnRemoteVariant { grid-column: 1 / -1; background: var(--ok-bg); border-color: var(--accent); color: var(--accent); }
html[data-theme="light"] .t-chip.on, html[data-theme="light"] .tray-pill.on, html[data-theme="light"] #liveStageActs #btnRemoteVariant { color: #07524e; }
#liveStageActs #btnClearStage.armed { color: var(--aux); border-color: var(--aux); }
.card-hd b, .crop-live-hd b, #reuseTxt { display: inline-flex; align-items: center; gap: 6px; }
.t-chip { height: 40px; font-size: 14px; line-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.t-chip svg.mi, .tray-pill svg.mi, #liveStageActs svg.mi, #btnNextSamePage svg.mi, .crop-live-hd svg.mi, #reuseTxt svg.mi { width: 18px; height: 18px; }
.tray-pill { height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; line-height: 34px; display: inline-flex; align-items: center; gap: 4px; }
.reuse-bar.show { flex-direction: column; align-items: stretch; }
.reuse-btn { height: 36px; font-size: 14px; line-height: 34px; }
.crop-lbl { top: -26px; height: 23px; font-size: 13px; line-height: 23px; }
.crop-live-hd { font-size: 13px; }
.done-mark span { height: 20px; font-size: 12px; line-height: 20px; }
html[data-theme="dark"] .done-mark span { background: #22d68a; color: #062115; }
/* ===== 2026-11-18 Claude 第四轮：适配——框题区随屏幕变高（小手机仍是 320，大手机和平板更大，框题更准）；平板和电脑上内容列和对讲页一样 680 宽 ===== */
.stage-box { height: clamp(320px, 52vh, 560px); }
@media (min-width: 720px) { .wrap { max-width: 680px; } }
/* ===== 2026-11-18 Claude 第五轮：学段 / 讲解下拉框和补充说明输入框字大一点、够高（原来 13–14px、高 40） ===== */
.sel-ctl { font-size: 15px; }
.note-inp { height: 44px; font-size: 15px; }
/* ===== 2026-11-18 R24：拍草稿找错因、整页智能题块快选框、远程错题复测与家长伴学递锦囊 ===== */
.btn-draft {
  height: 46px; border-radius: 12px; border: 2px solid var(--accent); background: var(--ok-bg);
  color: var(--accent); font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
html[data-theme="light"] .btn-draft { color: #07524e; border-color: #0b7470; background: #e6f4f1; }
.btn-draft:disabled { opacity: 0.52; cursor: default; }
.cand-mark {
  position: absolute; border: 2px dashed rgba(245, 166, 35, 0.82); border-radius: 7px;
  background: rgba(245, 166, 35, 0.06); pointer-events: none;
}
.cand-pill {
  position: absolute; left: -2px; top: -22px; height: 20px; padding: 0 7px; border-radius: 6px;
  border: none; background: #f5a623; color: #1b1302; font-size: 12px; line-height: 20px;
  font-weight: 700; cursor: pointer; pointer-events: auto; white-space: nowrap;
}
#liveStageActs #btnRemoteMistake { grid-column: 1 / -1; background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.nudge-box {
  margin-top: 4px; padding: 10px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line);
  display: none; flex-direction: column; gap: 8px;
}
.nudge-box.show { display: flex; }
.nudge-hd { font-size: 13px; line-height: 18px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 5px; }
.nudge-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.nudge-chip {
  height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); font-size: 13px; line-height: 32px; font-weight: 700; cursor: pointer;
}
.nudge-row { display: flex; gap: 6px; align-items: center; }
.nudge-inp {
  flex: 1; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font-size: 14px; font-weight: 400;
}
.nudge-send {
  height: 40px; padding: 0 14px; border-radius: 10px; border: none; background: var(--accent);
  color: var(--accent-ink); font-size: 14px; font-weight: 700; cursor: pointer; flex-shrink: 0;
}
/* ===== 2026-11-18 R25：整页先批后讲错题巡航 + 一键导出 A4 错题重练清卷（支持微信长按保存/打印） ===== */
.btn-check-page {
  height: 46px; border-radius: 12px; border: 2px solid var(--amber); background: var(--amber-bg);
  color: var(--amber); font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-check-page:disabled { opacity: 0.52; cursor: default; }
.chk-ok-mark {
  position: absolute; border: 2px solid #22d68a; border-radius: 6px;
  background: rgba(34, 214, 138, 0.09); pointer-events: none;
}
html[data-theme="light"] .chk-ok-mark { border-color: #0b7470; background: rgba(11, 116, 112, 0.08); }
.chk-ok-mark span {
  position: absolute; right: 2px; top: -20px; height: 19px; padding: 0 6px; border-radius: 5px;
  background: #22d68a; color: #062115; font-size: 11px; line-height: 19px; font-weight: 700; white-space: nowrap;
}
html[data-theme="light"] .chk-ok-mark span { background: #0b7470; color: #ffffff; }
.chk-fix-mark {
  position: absolute; border: 2px solid #ff6b6b; border-radius: 6px;
  background: rgba(255, 107, 107, 0.12); pointer-events: none;
}
html[data-theme="light"] .chk-fix-mark { border-color: #d63336; background: rgba(214, 51, 54, 0.09); }
.chk-pill {
  position: absolute; left: -2px; top: -22px; height: 20px; padding: 0 7px; border-radius: 6px;
  border: none; background: #ff6b6b; color: #1f0607; font-size: 12px; line-height: 20px;
  font-weight: 700; cursor: pointer; pointer-events: auto; white-space: nowrap;
}
html[data-theme="light"] .chk-pill { background: #d63336; color: #ffffff; }
#liveStageActs #btnPrintSheet { grid-column: 1 / -1; background: var(--panel-2); border-color: var(--accent); color: var(--accent); }
html[data-theme="light"] #liveStageActs #btnPrintSheet { color: #07524e; border-color: #0b7470; }
.print-modal {
  position: fixed; inset: 0; background: rgba(10, 16, 28, 0.78); z-index: 55;
  display: none; align-items: center; justify-content: center; padding: 14px; overflow-y: auto;
}
.print-modal.show { display: flex; }
.print-panel {
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; border-radius: 18px;
  background: var(--panel); border: 1px solid var(--line); padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.print-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.print-hd b { font-size: 16px; line-height: 22px; font-weight: 700; }
.print-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pm-btn {
  height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
  color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer;
}
.pm-btn.on { border-color: var(--accent); background: var(--ok-bg); color: var(--accent); }
html[data-theme="light"] .pm-btn.on { color: #07524e; border-color: #0b7470; }

@media print {
  body.print-sheet-ready > *:not(#printModal) { display: none !important; }
  body.print-sheet-ready #printModal { position: static !important; display: block !important; background: #ffffff !important; padding: 0 !important; }
  body.print-sheet-ready .print-panel > *:not(#printPreviewWrap) { display: none !important; }
  body.print-sheet-ready .print-panel { max-width: none !important; max-height: none !important; border: none !important; padding: 0 !important; background: #ffffff !important; }
  body.print-sheet-ready #printPreviewWrap { display: block !important; border: none !important; padding: 0 !important; background: #ffffff !important; }
  body.print-sheet-ready #printPreviewWrap .print-dl-row, body.print-sheet-ready #printPreviewHint { display: none !important; }
  body.print-sheet-ready #printPreviewImg { width: 100% !important; max-height: none !important; border: none !important; }

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let themePref = 'auto';
  let baseCanvas = null;
  let clientPageId = '';
  let loadedServerPageId = '';
  let curDoneCrops = [];
  let curCheckMarks = [];
  let mobileMistakes = [];
  let printSheetMode = 'desensitized';
  let printSelIds = new Set();
  let printSelectionInited = false;
  let printFromCowrite = false;
  let printBusy = false;
  let detectedBlocks = [];
  let mobScanCanvas = null;
  let pageDirtyForServer = false;
  let pendingCheckPageId = '', pendingPrevSummary = '', pendingPrevCheckSeq = -1;
  let pendingCowriteSeq = -1, lastCowriteSeqSeen = 0, lastCowriteBrief = null, mobCwModalItem = null, cwRemoteBusy = false;
  let userSelectedCrop = false;
  let pendingRotSteps = 0;
  let filterMode = 'crisp'; // 'crisp' | 'pencil' | 'raw'
  let crop = { x: 0.06, y: 0.12, w: 0.88, h: 0.56 };
  let busy = false;
  let pollInFlight = false;
  let stageSilentInFlight = false;
  let stageSilentCtl = null;
  let pageLoadSeq = 0;
  let mobileStateEtag = '';
  let serverHasStaged = false;
  let serverPages = [], activeServerPageId = '';
  let activeLessonId = '';
  let toastT = 0;
  let liveThumbRaf = 0;

  function abortStageSilent() {
    stageSilentInFlight = false;
    if (stageSilentCtl) {
      try { stageSilentCtl.abort(); } catch (e) {}
      stageSilentCtl = null;
    }
  }

  async function fetchWithTimeout(url, opts = {}, timeoutMs = 12000) {
    const ctl = new AbortController();
    const extSig = opts && opts.signal;
    if (extSig) {
      if (extSig.aborted) ctl.abort();
      else extSig.addEventListener('abort', () => ctl.abort(), { once: true });
    }
    const t = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      return await fetch(url, Object.assign({}, opts, { signal: ctl.signal }));
    } finally {
      clearTimeout(t);
    }
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  function jsAttrStr(s) {
    return escHtml(JSON.stringify(String(s == null ? '' : s)));
  }

  function releaseCanvas(c) {
    if (c) {
      try { c.width = 1; c.height = 1; } catch (e) {}
    }
  }

  function applyTheme() {
    const dark = themePref === 'dark' || (themePref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    $('metaThemeColor').setAttribute('content', dark ? '#0a101c' : '#e3dbce');
    $('btnTheme').innerHTML = `<svg class="mi"><use href="#mi-${themePref === 'light' ? 'sun' : (themePref === 'dark' ? 'moon' : 'auto')}"/></svg>`;
    $('btnTheme').setAttribute('aria-label', '深浅色：' + (themePref === 'light' ? '浅色' : (themePref === 'dark' ? '深色' : '自动')));
  }

  try {
    const tp = localStorage.getItem('tutor-mob-theme');
    if (tp === 'light' || tp === 'dark' || tp === 'auto') themePref = tp;
    const sp = localStorage.getItem('tutor-mob-ped');
    if (sp === 'auto' || sp === 'elem' || sp === 'junior') $('selPedagogy').value = sp;
    const sm = localStorage.getItem('tutor-mob-mode');
    if (sm === 'fast' || sm === 'deep' || sm === 'backup') $('selMode').value = sm;
  } catch (e) {}
  applyTheme();

  window.tsSetTheme = (p) => {      /* 2026-11-20 Claude：管理后台切深浅色时跟着变 */
    themePref = p === 'light' || p === 'dark' ? p : 'auto';
    try { localStorage.setItem('tutor-mob-theme', themePref); } catch (e) {}
    applyTheme();
  };

  window.cycleTheme = () => {
    themePref = themePref === 'auto' ? 'light' : (themePref === 'light' ? 'dark' : 'auto');
    try { localStorage.setItem('tutor-mob-theme', themePref); } catch (e) {}
    applyTheme();
  };

  window.saveLocalPrefs = () => {
    try {
      localStorage.setItem('tutor-mob-ped', $('selPedagogy').value);
      localStorage.setItem('tutor-mob-mode', $('selMode').value);
    } catch (e) {}
  };

  function toast(msg) {
    const el = $('toastEl');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 2900);
  }

  function decodeFileToCanvas(fileOrBlob) {
    return new Promise((resolve, reject) => {
      if (window.createImageBitmap) {
        createImageBitmap(fileOrBlob).then(bmp => {
          const maxSide = 1600;
          const sc = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
          const w = Math.max(32, Math.round(bmp.width * sc));
          const h = Math.max(32, Math.round(bmp.height * sc));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(bmp, 0, 0, w, h);
          if (bmp.close) bmp.close();
          resolve(c);
        }).catch(() => fallbackImgDecode(fileOrBlob, resolve, reject));
      } else {
        fallbackImgDecode(fileOrBlob, resolve, reject);
      }
    });
  }

  function fallbackImgDecode(blob, resolve, reject) {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxSide = 1600;
      const sc = Math.min(1, maxSide / Math.max(img.naturalWidth || 32, img.naturalHeight || 32));
      const w = Math.max(32, Math.round(img.naturalWidth * sc));
      const h = Math.max(32, Math.round(img.naturalHeight * sc));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode_failed')); };
    img.src = url;
  }

  // Chroma-preserving document shadow lift + optional Pencil Boost gamma darkening for faint 2B homework!
  function applyDocumentCrispFilter(ctx, w, h, pencilBoost = false) {
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const hist = new Uint32Array(256);
    const step = Math.max(4, Math.floor((w * h) / 14000) * 4);
    let samples = 0;
    for (let i = 0; i < d.length; i += step) {
      const lum = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
      hist[lum]++;
      samples++;
    }
    if (!samples) return;
    let accHi = 0, whitePt = 240, medPt = 200, accMed = 0;
    for (let k = 255; k >= 125; k--) {
      accHi += hist[k];
      if (accHi >= samples * 0.14) { whitePt = Math.max(158, k); break; }
    }
    for (let k = 255; k >= 0; k--) {
      accMed += hist[k];
      if (accMed >= samples * 0.50) { medPt = k; break; }
    }
    // Already clean white digital screenshot/PDF -> preserve 100% original pixels unless user explicitly chose Pencil Boost!
    if (!pencilBoost && whitePt >= 242 && medPt >= 214) return;

    let accLo = 0, blackPt = 24;
    for (let k = 0; k <= 105; k++) {
      accLo += hist[k];
      if (accLo >= samples * 0.015) { blackPt = Math.min(68, k); break; }
    }
    const floorShift = blackPt * (pencilBoost ? 0.68 : 0.55);
    const span = Math.max(85, whitePt - floorShift);
    const gain = Math.max(1.0, 250 / span);
    const gammaLut = new Uint8Array(256);
    for (let v = 0; v < 256; v++) {
      gammaLut[v] = pencilBoost && v < 242 ? Math.max(0, Math.min(255, Math.round(255 * Math.pow(v / 255, 1.48)))) : v;
    }

    for (let i = 0; i < d.length; i += 4) {
      const r0 = d[i], g0 = d[i + 1], b0 = d[i + 2];
      const mx = r0 > g0 ? (r0 > b0 ? r0 : b0) : (g0 > b0 ? g0 : b0);
      const mn = r0 < g0 ? (r0 < b0 ? r0 : b0) : (g0 < b0 ? g0 : b0);
      const chroma = mx - mn;
      const r1 = gammaLut[Math.max(0, Math.min(255, ((r0 - floorShift) * gain) | 0))];
      const g1 = gammaLut[Math.max(0, Math.min(255, ((g0 - floorShift) * gain) | 0))];
      const b1 = gammaLut[Math.max(0, Math.min(255, ((b0 - floorShift) * gain) | 0))];
      if (chroma >= 26) {
        // Blend back toward original RGB on colored geometry fills/annotations so shaded areas stay visible!
        const keep = Math.min(0.72, (chroma - 20) / 90);
        d[i] = (r1 * (1 - keep) + r0 * keep) | 0;
        d[i + 1] = (g1 * (1 - keep) + g0 * keep) | 0;
        d[i + 2] = (b1 * (1 - keep) + b0 * keep) | 0;
      } else {
        d[i] = r1; d[i + 1] = g1; d[i + 2] = b1;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function scheduleLiveCropThumb() {
    if (liveThumbRaf) return;
    liveThumbRaf = requestAnimationFrame(() => {
      liveThumbRaf = 0;
      if (!baseCanvas) return;
      const sx = Math.round(crop.x * baseCanvas.width);
      const sy = Math.round(crop.y * baseCanvas.height);
      const sw = Math.max(24, Math.min(baseCanvas.width - sx, Math.round(crop.w * baseCanvas.width)));
      const sh = Math.max(24, Math.min(baseCanvas.height - sy, Math.round(crop.h * baseCanvas.height)));
      const sc = Math.min(1, 460 / Math.max(sw, sh), 108 / Math.max(1, sh));
      const tw = Math.max(24, Math.round(sw * sc));
      const th = Math.max(20, Math.round(sh * sc));
      const lc = $('cropLiveCanvas');
      lc.width = tw; lc.height = th;
      const lctx = lc.getContext('2d', { willReadFrequently: true });
      lctx.drawImage(baseCanvas, sx, sy, sw, sh, 0, 0, tw, th);
      if (filterMode !== 'raw') applyDocumentCrispFilter(lctx, tw, th, filterMode === 'pencil');
      const modeLbl = filterMode === 'pencil' ? '铅笔加深' : (filterMode === 'crisp' ? '增晰已开' : '原图直传');
      $('cropLiveMeta').textContent = modeLbl;
    });
  }

  function mobBoxIoU(a, b) {
    if (!a || !b) return 0;
    const ix = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
    const iy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
    const inter = ix * iy;
    if (inter <= 0) return 0;
    return inter / Math.max(1e-6, a.w * a.h + b.w * b.h - inter);
  }

  function detectWorksheetQuestionBlocks(srcCanvas, doneList) {
    if (!srcCanvas || srcCanvas.width < 80 || srcCanvas.height < 80) return [];
    const GW = 180, GH = 240;
    if (!mobScanCanvas) mobScanCanvas = document.createElement('canvas');
    mobScanCanvas.width = GW;
    mobScanCanvas.height = GH;
    const ctx = mobScanCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(srcCanvas, 0, 0, GW, GH);
    const data = ctx.getImageData(0, 0, GW, GH).data;
    const hist = new Uint32Array(256);
    const lums = new Uint8Array(GW * GH);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const l = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
      lums[p] = l;
      hist[l]++;
    }
    const total = GW * GH;
    let acc = 0, p10 = 0, p75 = 240;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.10) { p10 = v; break; } }
    acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.75) { p75 = v; break; } }
    if (p75 - p10 < 18) return [];
    const thr = Math.max(40, p75 - 26);
    const xLo = Math.round(GW * 0.04), xHi = Math.round(GW * 0.96);
    const yLo = Math.round(GH * 0.03), yHi = Math.round(GH * 0.97);
    const rowCnt = new Uint16Array(GH), rowMinX = new Uint16Array(GH), rowMaxX = new Uint16Array(GH);
    for (let y = yLo; y < yHi; y++) {
      let cnt = 0, mn = GW, mx = 0;
      const base = y * GW;
      for (let x = xLo; x < xHi; x++) {
        if (lums[base + x] < thr) { cnt++; if (x < mn) mn = x; if (x > mx) mx = x; }
      }
      rowCnt[y] = cnt;
      rowMinX[y] = cnt > 0 ? mn : GW;
      rowMaxX[y] = cnt > 0 ? mx : 0;
    }
    const minRowInk = Math.max(3, Math.round((xHi - xLo) * 0.022));
    const lines = [];
    let inLn = false, ly0 = 0, lmn = GW, lmx = 0;
    for (let y = yLo; y <= yHi; y++) {
      const active = y < yHi && rowCnt[y] >= minRowInk;
      if (active) {
        if (!inLn) { inLn = true; ly0 = y; lmn = rowMinX[y]; lmx = rowMaxX[y]; }
        else { if (rowMinX[y] < lmn) lmn = rowMinX[y]; if (rowMaxX[y] > lmx) lmx = rowMaxX[y]; }
      } else if (inLn) {
        inLn = false;
        if (y - ly0 >= 2) lines.push({ y0: ly0, y1: y, x0: lmn, x1: lmx });
      }
    }
    if (!lines.length) return [];
    const gapSplit = Math.max(6, Math.round(GH * 0.038));
    const blocks = [];
    let cur = Object.assign({}, lines[0]);
    for (let i = 1; i < lines.length; i++) {
      const ln = lines[i];
      const gap = ln.y0 - cur.y1;
      const curH = cur.y1 - cur.y0;
      const leftOutdent = (cur.x0 - ln.x0) >= Math.round(GW * 0.06) && curH >= Math.round(GH * 0.11) && gap >= 3;
      if (gap >= gapSplit || leftOutdent || (curH >= Math.round(GH * 0.34) && gap >= 4)) {
        blocks.push(cur);
        cur = Object.assign({}, ln);
      } else {
        cur.y1 = ln.y1;
        cur.x0 = Math.min(cur.x0, ln.x0);
        cur.x1 = Math.max(cur.x1, ln.x1);
      }
    }
    blocks.push(cur);
    const out = [];
    for (const b of blocks) {
      const rx = Math.max(0.02, b.x0 / GW - 0.025);
      const ry = Math.max(0.02, b.y0 / GH - 0.016);
      const rw = Math.min(0.98 - rx, (b.x1 - b.x0) / GW + 0.05);
      const rh = Math.min(0.98 - ry, (b.y1 - b.y0) / GH + 0.032);
      if (rh < 0.045 || rh > 0.78 || rw < 0.18) continue;
      const box = { x: Number(rx.toFixed(4)), y: Number(ry.toFixed(4)), w: Number(rw.toFixed(4)), h: Number(rh.toFixed(4)) };
      if (!(doneList || []).some(dc => dc && dc.crop && mobBoxIoU(dc.crop, box) >= 0.45)) out.push(box);
      if (out.length >= 8) break;
    }
    return out;
  }

  window.selectMobDetectedBlock = (idx) => {
    const b = detectedBlocks[idx];
    if (!b) return;
    userSelectedCrop = true;
    crop = Object.assign({}, b);
    paintCropWin();
    paintDoneMarks();
    toast(`✨ 已智能框中第 ${idx + 1} 题，点下方按钮即可投屏！`);
  };

  window.selectMobCheckMark = (idx) => {
    const m = curCheckMarks[idx];
    if (!m || !m.box) return;
    userSelectedCrop = true;
    crop = Object.assign({}, m.box);
    paintCropWin();
    paintDoneMarks();
    const defAct = m.cowrite_id
      ? '可改好重拍点「静默伴写核查框选题」复查，或展开更多点「拍草稿找错」'
      : (m.status === 'blank' ? '点下方「投屏开讲这道题」开启分步引导！' : '点下方「拍草稿找错」投屏启发订正！');
    toast(`🔍 已框中${m.no || '该题'}：${m.note ? m.note + ' · ' : ''}${defAct}`);
  };

  function paintDoneMarks() {
    const dl = $('mobDoneLayer');
    const layer = $('mobCropLayer');
    if (!dl || !layer) return;
    const W = layer.clientWidth || 280, H = layer.clientHeight || 280;
    const chkHtml = (curCheckMarks || []).map((m, idx) => {
      const b = m && m.box;
      if (!b) return '';
      if ((curDoneCrops || []).some(dc => dc && dc.crop && mobBoxIoU(dc.crop, b) >= 0.45)) return '';
      const noLbl = escHtml(m.no || `第${idx + 1}题`);
      const flipSt = (b.y * H) < 26 ? ' style="top:2px;"' : '';
      if (m.status === 'ok') {
        return `<div class="chk-ok-mark" style="left:${Math.round(b.x * W)}px;top:${Math.round(b.y * H)}px;width:${Math.round(b.w * W)}px;height:${Math.round(b.h * H)}px;"><span${flipSt}>✓${noLbl}·对</span></div>`;
      }
      const stTag = m.status === 'blank' ? '未答' : '待订正';
      return `<div class="chk-fix-mark" style="left:${Math.round(b.x * W)}px;top:${Math.round(b.y * H)}px;width:${Math.round(b.w * W)}px;height:${Math.round(b.h * H)}px;"><button type="button" class="chk-pill"${flipSt} onpointerdown="event.stopPropagation()" onclick="event.stopPropagation(); selectMobCheckMark(${idx})">🔍${noLbl}·${stTag}</button></div>`;
    }).join('');
    const candHtml = (curCheckMarks && curCheckMarks.length > 0) ? '' : (detectedBlocks || []).map((b, idx) => {
      if (mobBoxIoU(b, crop) >= 0.72) return '';
      if ((curDoneCrops || []).some(dc => dc && dc.crop && mobBoxIoU(dc.crop, b) >= 0.45)) return '';
      const flipSt = (b.y * H) < 26 ? ' style="top:2px;"' : '';

  (() => {
    const layer = $('mobCropLayer');
    let drag = null;
    layer.addEventListener('pointerdown', e => {
      if (drag || !baseCanvas) return;
      if (e.target && e.target.closest && e.target.closest('.cand-pill, .chk-pill')) return;
      const rect = layer.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const nx = Math.max(0, Math.min(1, px / rect.width));
      const ny = Math.max(0, Math.min(1, py / rect.height));
      const x1 = crop.x * rect.width, y1 = crop.y * rect.height;
      const x2 = (crop.x + crop.w) * rect.width, y2 = (crop.y + crop.h) * rect.height;
      // Pixel-distance nearest-corner/edge hit detection: prevents nw/sw overlap on narrow 1-line boxes!
      const corners = [['nw', x1, y1], ['ne', x2, y1], ['sw', x1, y2], ['se', x2, y2]];
      let bestC = '', bestD = 999;
      for (const [m, cx, cy] of corners) {
        const d = Math.hypot(px - cx, py - cy);
        if (d < bestD) { bestD = d; bestC = m; }
      }
      let mode = '';
      if (bestD <= 24) {
        mode = bestC;
      } else if (px >= x1 - 8 && px <= x2 + 8 && Math.abs(py - y1) <= 13 && Math.abs(py - y1) <= Math.abs(py - y2)) {
        mode = 'n';
      } else if (px >= x1 - 8 && px <= x2 + 8 && Math.abs(py - y2) <= 13) {
        mode = 's';
      } else if (py >= y1 - 8 && py <= y2 + 8 && Math.abs(px - x1) <= 13 && Math.abs(px - x1) <= Math.abs(px - x2)) {
        mode = 'w';
      } else if (py >= y1 - 8 && py <= y2 + 8 && Math.abs(px - x2) <= 13) {
        mode = 'e';
      } else if (nx >= crop.x && nx <= crop.x + crop.w && ny >= crop.y && ny <= crop.y + crop.h) {
        mode = 'move';
      } else {
        mode = 'new';
      }
      drag = { pointerId: e.pointerId, mode, sx: nx, sy: ny, orig: Object.assign({}, crop) };
      try { layer.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    layer.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const rect = layer.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const nx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const ny = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      const dx = nx - drag.sx, dy = ny - drag.sy;
      const o = drag.orig;
      const MIN_W = 0.08, MIN_H = 0.04;
      if (drag.mode === 'move') {
        crop.x = Math.max(0, Math.min(1 - o.w, o.x + dx));
        crop.y = Math.max(0, Math.min(1 - o.h, o.y + dy));
      } else if (drag.mode === 'new') {
        const x1 = Math.min(drag.sx, nx), x2 = Math.max(drag.sx, nx);
        const y1 = Math.min(drag.sy, ny), y2 = Math.max(drag.sy, ny);
        if (x2 - x1 >= MIN_W && y2 - y1 >= MIN_H) {
          crop = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
        }
      } else {
        let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
        if (drag.mode.includes('w')) x1 = Math.min(x2 - MIN_W, Math.max(0, nx));
        if (drag.mode.includes('e')) x2 = Math.max(x1 + MIN_W, Math.min(1, nx));
        if (drag.mode.includes('n')) y1 = Math.min(y2 - MIN_H, Math.max(0, ny));
        if (drag.mode.includes('s')) y2 = Math.max(y1 + MIN_H, Math.min(1, ny));
        crop = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
      }
      if (Math.abs(dx) >= 0.008 || Math.abs(dy) >= 0.008) userSelectedCrop = true;
      paintCropWin();
    });
    const endMobDrag = e => {
      if (!drag) return;
      if (e && e.pointerId !== undefined && e.pointerId !== drag.pointerId) return;
      drag = null;
    };
    layer.addEventListener('pointerup', endMobDrag);
    layer.addEventListener('pointercancel', endMobDrag);
    layer.addEventListener('lostpointercapture', endMobDrag);
    window.addEventListener('resize', () => {
      if (!baseCanvas || stageResizeRaf) return;

  // Adaptive byte-budget JPEG encoder: guarantees each HTTP POST stays well below Nginx 1MB body limit!
  function encodeCanvasUnderBudget(srcCanvas, maxB64Len, initQ) {
    let q = initQ || 0.82;
    let url = srcCanvas.toDataURL('image/jpeg', q);
    while (url.length > maxB64Len && q > 0.50) {
      q = Math.round((q - 0.12) * 100) / 100;
      url = srcCanvas.toDataURL('image/jpeg', q);
    }
    if (url.length <= maxB64Len) return url;
    const shrink = Math.max(0.55, Math.sqrt(maxB64Len / url.length) * 0.92);
    const sw = Math.max(64, Math.round(srcCanvas.width * shrink));
    const sh = Math.max(64, Math.round(srcCanvas.height * shrink));
    const tmp = document.createElement('canvas');
    tmp.width = sw; tmp.height = sh;
    tmp.getContext('2d').drawImage(srcCanvas, 0, 0, sw, sh);
    const out = tmp.toDataURL('image/jpeg', 0.68);
    releaseCanvas(tmp);
    return out;
  }

  function exportCroppedJpegB64(maxB64 = 380000) {
    const sx = Math.round(crop.x * baseCanvas.width);
    const sy = Math.round(crop.y * baseCanvas.height);
    const sw = Math.max(24, Math.min(baseCanvas.width - sx, Math.round(crop.w * baseCanvas.width)));
    const sh = Math.max(24, Math.min(baseCanvas.height - sy, Math.round(crop.h * baseCanvas.height)));
    const maxCropSide = 1400;
    const sc = Math.min(1, maxCropSide / Math.max(sw, sh));
    const cw = Math.max(24, Math.round(sw * sc));
    const ch = Math.max(24, Math.round(sh * sc));
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(baseCanvas, sx, sy, sw, sh, 0, 0, cw, ch);
    if (filterMode !== 'raw') applyDocumentCrispFilter(ctx, cw, ch, filterMode === 'pencil');
    const minCardH = Math.max(ch, Math.min(480, Math.round(cw * 0.22)));
    if (minCardH > ch + 8) {
      const card = document.createElement('canvas');
      card.width = cw; card.height = minCardH;
      const cctx = card.getContext('2d');
      cctx.fillStyle = '#ffffff';
      cctx.fillRect(0, 0, cw, minCardH);
      cctx.drawImage(c, 0, Math.round((minCardH - ch) / 2));
      releaseCanvas(c);
      const outCard = encodeCanvasUnderBudget(card, maxB64, 0.82);
      releaseCanvas(card);
      return outCard;
    }
    const out = encodeCanvasUnderBudget(c, maxB64, 0.82);
    releaseCanvas(c);
    return out;
  }

  function exportFullPageJpegB64(maxB64 = 720000) {
    const maxPageSide = 1400;
    const sc = Math.min(1, maxPageSide / Math.max(baseCanvas.width, baseCanvas.height));
    if (sc >= 0.99) return encodeCanvasUnderBudget(baseCanvas, maxB64, 0.76);
    const pw = Math.max(32, Math.round(baseCanvas.width * sc));
    const ph = Math.max(32, Math.round(baseCanvas.height * sc));
    const c = document.createElement('canvas');
    c.width = pw; c.height = ph;
    c.getContext('2d').drawImage(baseCanvas, 0, 0, pw, ph);
    const out = encodeCanvasUnderBudget(c, maxB64, 0.76);
    releaseCanvas(c);
    return out;
  }

  window.remoteCoWriteCtl = async (subAct, extra = {}) => {
    if (cwRemoteBusy) {
      toast('上一条伴写指令正在执行，请稍候…');

    }
    cwRemoteBusy = true;
    renderMobCowritePanel(lastCowriteBrief);
    const toastActMap = {
      scan_desk: '🔍 正在让大屏静默扫描桌面试卷…',
      recheck_warns: '🔄 正在让大屏并行复查待自查错题…',
      explain_one: '🎓 正在家里大屏静默展开本题错因拆解…',
      explain_top_warn: '🎓 正在家里大屏静默展开首道待查题拆解…',
      variant_one: '🎯 正在家里大屏静默投送本题同类变式…',
      sprint_warns: '🚀 正在为大屏组卷初三伴写静默连闯（零语音）…',
      resolve_one: '正在同步订正状态…',
      star_one: '正在更新重点题标记…',
    };
    toast(toastActMap[subAct] || '正在同步指令到大屏伴写…');
    try {
      const tout = (subAct === 'scan_desk' || subAct === 'recheck_warns' || subAct === 'recheck_one' || subAct === 'variant_one' || subAct === 'sprint_warns') ? 35000 : 12000;
      const { r, j } = await postMobileJson(Object.assign({ action: 'cowrite_remote_ctl', sub_action: subAct }, extra || {}), tout);
      if (r.ok && j && j.ok) {
        if (j.cowrite) {
          lastCowriteBrief = j.cowrite;
          renderMobCowritePanel(j.cowrite);
        }
        toast(j.message || '伴写指令已生效');
        if (j.pending) {
          pendingCowriteSeq = (j.prev_cowrite_seq != null) ? Number(j.prev_cowrite_seq) : lastCowriteSeqSeen;
          setTimeout(pollMobileState, 2500);
          setTimeout(pollMobileState, 5500);
          setTimeout(pollMobileState, 9500);
        } else {
          pollMobileState();
        }
        return true;
      } else {
        toast((j && j.error) || '伴写指令未成功');
        return false;
      }
    } catch (e) {
      toast('连接大屏超时，请检查 VPN 连接');
      return false;
    } finally {
      cwRemoteBusy = false;
      renderMobCowritePanel(lastCowriteBrief);
    }
  };

    let copied = false;
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(txt);
        copied = true;
      }
    } catch (e) {}
    if (!copied) {
      try {
        const ta = document.createElement('textarea');
        ta.value = txt;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        copied = !!(document.execCommand && document.execCommand('copy'));
        ta.remove();
      } catch (e) {}
    }
    toast(copied ? '📋 已复制今晚伴写战报，可直接粘贴发微信！' : '战报已生成，请使用系统复制功能');

  function renderPrintMistakeChecklist() {
    const box = $('printMistakeList');
    if (!box) return;
    const validIds = new Set(mobileMistakes.map(m => m.id));
    for (const oldId of [...printSelIds]) {
      if (!validIds.has(oldId)) printSelIds.delete(oldId);
    }
    if (!mobileMistakes.length) {
      printSelectionInited = false;
      box.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:6px 2px;">当前错题本暂无历史错题，点击下方生成将自动选用大屏当前题或精选易错母题排版示范清卷。</div>';
      return;
    }
    if (!printSelectionInited) {
      printSelectionInited = true;
      mobileMistakes.filter(m => !m.graduated).slice(0, 4).forEach(m => printSelIds.add(m.id));
      if (!printSelIds.size) mobileMistakes.slice(0, 3).forEach(m => printSelIds.add(m.id));
    }
    box.innerHTML = mobileMistakes.map(m => {
      const ck = printSelIds.has(m.id) ? 'checked' : '';
      const badge = m.graduated ? '已销号' : (m.error_tag || '待复练');
      return `<label class="print-item"><input type="checkbox" ${ck} onchange="togglePrintMistake(${jsAttrStr(m.id)}, this.checked)"><span>${escHtml(m.title)}（${escHtml(badge)}）</span></label>`;
    }).join('');
  }

  window.openPrintSheetModal = (keepCowrite = false) => {
    if (!keepCowrite) printFromCowrite = false;
    document.body.classList.remove('print-sheet-ready');
    if (!printSelIds.size) printSelectionInited = false;
    renderPrintMistakeChecklist();
    $('printModal').classList.add('show');
  };

  window.openCwPrintSheet = async () => {
    printFromCowrite = true;
    const cwUnrecNow = (lastCowriteBrief && lastCowriteBrief.digest && Number(lastCowriteBrief.digest.unrecorded_warn_count)) || 0;
    let freshIds = [];
    if (cwUnrecNow > 0) {
      toast('📌 正在自动收录伴写易错题并准备 A4 清卷…');
      try {
        const { r, j } = await postMobileJson({ action: 'cowrite_enroll_warns' }, 10000);
        if (r.ok && j && j.ok) {
          if (Array.isArray(j.mistakes)) mobileMistakes = j.mistakes;
          if (Array.isArray(j.enrolled_ids)) freshIds = j.enrolled_ids;
          if (j.cowrite) {
            lastCowriteBrief = j.cowrite;
            renderMobCowritePanel(j.cowrite);
          }
        }
      } catch (e) {}
    }
    const cwList = mobileMistakes.filter(m => m && !m.graduated && String(m.error_tag || '').startsWith('伴写·'));
    const keepIds = [...new Set([...freshIds, ...cwList.map(m => m.id)].filter(Boolean))].slice(0, 6);
    if (keepIds.length) {
      printSelIds.clear();
      keepIds.forEach(id => { if (id) printSelIds.add(id); });
      printSelectionInited = true;
    }
    openPrintSheetModal(true);
  };

  let printReqSeq = 0, printBlobUrl = '', printAbortCtl = null;
  function _revokePrintBlob() {
    if (printBlobUrl) {
      try { URL.revokeObjectURL(printBlobUrl); } catch (e) {}
      printBlobUrl = '';
    }
  }
  function _cancelPrintReq() {
    printReqSeq++;
    if (printAbortCtl) {
      try { printAbortCtl.abort(); } catch (e) {}
      printAbortCtl = null;
    }
    printBusy = false;
    const btn = $('btnGenPrintSheet');
    if (btn) btn.disabled = false;
  }

  window.closePrintSheetModal = () => {
    _cancelPrintReq();
    printFromCowrite = false;
    document.body.classList.remove('print-sheet-ready');
    $('printModal').classList.remove('show');
    if ($('printPreviewWrap')) $('printPreviewWrap').classList.remove('show');
    if ($('printPreviewImg')) $('printPreviewImg').removeAttribute('src');
    if ($('btnDownloadSheet')) $('btnDownloadSheet').href = '#';
    _revokePrintBlob();
  };

  window.setPrintSheetMode = (m) => {
    const nextM = m === 'original' ? 'original' : 'desensitized';
    if (nextM !== printSheetMode) {
      _cancelPrintReq();
      if ($('printPreviewWrap')) $('printPreviewWrap').classList.remove('show');
      document.body.classList.remove('print-sheet-ready');
      if ($('printPreviewImg')) $('printPreviewImg').removeAttribute('src');
      if ($('btnDownloadSheet')) $('btnDownloadSheet').href = '#';
      _revokePrintBlob();
    }
    printSheetMode = nextM;
    $('btnPmDesens').classList.toggle('on', printSheetMode === 'desensitized');
    $('btnPmOrig').classList.toggle('on', printSheetMode === 'original');
  };

  window.togglePrintMistake = (id, checked) => {
    if (checked) {
      if (printSelIds.size >= 6) {
        toast('单张 A4 清卷最多勾选 6 道题，留足手写演算空白哦');
        renderPrintMistakeChecklist();
        return;
      }
      printSelIds.add(id);
    } else {
      printSelIds.delete(id);
    }
    _cancelPrintReq();
    if ($('printPreviewWrap')) $('printPreviewWrap').classList.remove('show');
    if ($('printPreviewImg')) $('printPreviewImg').removeAttribute('src');
    if ($('btnDownloadSheet')) $('btnDownloadSheet').href = '#';
    _revokePrintBlob();
    document.body.classList.remove('print-sheet-ready');
  };

  function wrapCanvasLines(ctx, text, maxW) {
    const out = [];
    const paras = String(text || '').split(/\n+/);
    for (const p of paras) {
      let line = '';
      for (const ch of p) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxW && line) {
          out.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      if (line) out.push(line);
    }
    return out.length ? out : [''];
  }

  window.generateA4PrintSheet = async () => {
    if (printBusy) return;
    if (!printFromCowrite && mobileMistakes.length > 0 && printSelIds.size === 0) {
      toast('请先在上方列表勾选至少 1 道要排版打印的错题哦！');
      return;
    }
    const mySeq = ++printReqSeq;
    const ctl = new AbortController();
    printAbortCtl = ctl;
    printBusy = true;
    const btn = $('btnGenPrintSheet');
    if (btn) btn.disabled = true;
    toast(printSheetMode === 'desensitized' ? '✨ AI 正在将错题脱敏换数并排版 A4 清卷…' : '📄 正在擦除痕迹排版原错题 A4 清卷…');
    try {
      const pedagogy = $('selPedagogy').value || 'auto';
      const { r, j } = await postMobileJson({
        action: 'prepare_print_sheet',
        ids: [...printSelIds],
        sheet_mode: printSheetMode,
        pedagogy,
        from_cowrite: !!printFromCowrite,
      }, 34000, { signal: ctl.signal });
      if (mySeq !== printReqSeq || !$('printModal').classList.contains('show')) return;
      if (!r.ok || !j || !j.ok || !Array.isArray(j.items) || !j.items.length) {
        toast((j && j.error) || '生成打印清卷失败');
        return;
      }
      const W = 1240, H = 1754;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      // Header block
      ctx.fillStyle = '#111827';
      ctx.font = '700 38px "PingFang SC", "Noto Sans CJK SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(j.title || 'AI 错题重练清卷', W / 2, 74);

      const d = new Date();
      const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      ctx.font = '400 22px "PingFang SC", "Noto Sans CJK SC", sans-serif';
      ctx.fillStyle = '#4b5563';
      ctx.fillText(`日期：${dateStr}      姓名：____________      独立用时：______ 分钟      自评：☆☆☆☆☆`, W / 2, 118);

      ctx.strokeStyle = '#1f2937';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(72, 140);
      ctx.lineTo(W - 72, 140);
      ctx.stroke();

      // Questions & generous scratch boxes
      const items = j.items.slice(0, 6);
      const topY = 166, botY = 1585;
      const slotH = Math.floor((botY - topY) / items.length);
      ctx.textAlign = 'left';

      const denseSheet = items.length >= 5;
      const qFontPx = denseSheet ? 22 : 25;
      const qLineH = denseSheet ? 30 : 36;
      const maxQLines = items.length >= 6 ? 3 : 4;
      items.forEach((it, idx) => {
        const y0 = topY + idx * slotH;
        ctx.fillStyle = '#0b7470';
        ctx.font = `700 ${denseSheet ? 22 : 24}px "PingFang SC", "Noto Sans CJK SC", sans-serif`;
        ctx.fillText(`【第 ${idx + 1} 题 · ${it.tag || '靶向巩固'}】`, 72, y0 + 26);

        ctx.fillStyle = '#111827';
        let usePx = qFontPx, useLineH = qLineH, useMax = maxQLines;
        ctx.font = `700 ${usePx}px "PingFang SC", "Noto Sans CJK SC", sans-serif`;
        let allQLines = wrapCanvasLines(ctx, it.question || '', W - 156);
        if (allQLines.length > useMax) {
          usePx = denseSheet ? 19 : 21;
          useLineH = denseSheet ? 26 : 30;
          useMax = maxQLines + 1;
          ctx.font = `700 ${usePx}px "PingFang SC", "Noto Sans CJK SC", sans-serif`;
          allQLines = wrapCanvasLines(ctx, it.question || '', W - 156);
        }
        const qLines = allQLines.slice(0, useMax);
        if (allQLines.length > useMax && qLines.length) {
          qLines[qLines.length - 1] = qLines[qLines.length - 1].slice(0, -1) + '…';
        }
        const qStartY = denseSheet ? 54 : 64;
        qLines.forEach((ln, li) => {
          ctx.fillText(ln, 78, y0 + qStartY + li * useLineH);
        });

        const boxTop = y0 + qStartY + qLines.length * useLineH + 6;
        const maxBoxBot = y0 + slotH - (denseSheet ? 18 : 14);
        const boxH = Math.max(52, maxBoxBot - boxTop);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(78, boxTop, W - 156, boxH);
        ctx.setLineDash([]);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '400 19px "PingFang SC", "Noto Sans CJK SC", sans-serif';
        const isWrSheetIt = !!it.is_writing;
        const isHumSheetIt = !isWrSheetIt && (['chinese', 'english', 'history', 'civics'].includes(it.subject || '') || (['biology', 'geography'].includes(it.subject || '') && !/℃|摄氏度|海拔.*米|比例尺|放大.*倍/.test(it.question || '')));
        ctx.fillText(isWrSheetIt ? '审题提纲与升格佳句练笔区：' : (isHumSheetIt ? '思路梳理与规范作答区：' : '列式与画图演算区：'), 94, boxTop + 27);
        if (!isWrSheetIt) {
          ctx.fillText('答：____________________________', W - 430, boxH >= 64 ? (boxTop + boxH - 15) : (boxTop + 27));
        }
      });

      // Bottom fold-line verification strip
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(72, 1612);
      ctx.lineTo(W - 72, 1612);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#64748b';
      ctx.font = '700 19px "PingFang SC", "Noto Sans CJK SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✂ ────── 家长核对折叠线（做题前请先沿虚线向背面折起） ──────', W / 2, 1642);

      const keyStr = items.map((it, idx) => `第${idx + 1}题：${it.ans_check || '见原题验算'}`).join('    |    ');
      ctx.font = '400 18px "PingFang SC", "Noto Sans CJK SC", sans-serif';
      const keyLines = wrapCanvasLines(ctx, keyStr, W - 160).slice(0, 2);
      keyLines.forEach((kl, ki) => ctx.fillText(kl, W / 2, 1676 + ki * 26));

      let jpgUrl = '';
      if (typeof c.toBlob === 'function') {
        const blob = await new Promise(resolve => c.toBlob(resolve, 'image/jpeg', 0.90));
        if (blob) {
          jpgUrl = URL.createObjectURL(blob);
          _revokePrintBlob();
          printBlobUrl = jpgUrl;
        }
      }
      if (!jpgUrl) jpgUrl = c.toDataURL('image/jpeg', 0.90);
      releaseCanvas(c);
      if (mySeq !== printReqSeq || !$('printModal').classList.contains('show')) {
        _revokePrintBlob();
        return;
      }
      $('printPreviewImg').src = jpgUrl;
      $('btnDownloadSheet').href = jpgUrl;
      $('btnDownloadSheet').download = `${printSheetMode === 'original' ? 'AI原错题重练清卷' : 'AI脱敏换数清卷'}_${dateStr.replace(/-/g, '')}.jpg`;
      $('printPreviewWrap').classList.add('show');
      document.body.classList.add('print-sheet-ready');
      toast('✅ A4 清卷已生成！长按预览图即可转发微信打印或保存到相册');
    } catch (e) {
      if (mySeq !== printReqSeq || ctl.signal.aborted) return;
      toast('排版生成超时，请检查连接后重试');
    } finally {
      if (printAbortCtl === ctl) printAbortCtl = null;
      if (mySeq === printReqSeq) {
        printBusy = false;
        if (btn) btn.disabled = false;
      }
    }
  };

  function syncMobPollTimer() {
    const shouldRun = embedActive && !document.hidden;
    if (!shouldRun && mobPollTimer) {
      clearInterval(mobPollTimer);
      mobPollTimer = null;
    } else if (shouldRun && !mobPollTimer) {
      mobPollTimer = setInterval(pollMobileState, 4500);
    }
  }
  window.tsEmbedSetActive = (active) => {
    embedActive = !!active;
    if (!embedActive) {
      if (typeof abortStageSilent === 'function') abortStageSilent();
      _cancelPrintReq();
    }
    syncMobPollTimer();
    if (embedActive && !document.hidden) pollMobileState();
  };
  window.toggleMobMore = () => {
    const box = $('mobMoreTools'), btn = $('btnMobMore');
    if (!box) return;
    const closed = box.classList.toggle('collapsed');
    if (btn) btn.textContent = closed ? '更多选项与草稿精批 ▾' : '收起次要选项 ▴';
  };
  document.addEventListener('visibilitychange', () => {
    syncMobPollTimer();
    if (embedActive && !document.hidden) pollMobileState();
  });

  /* ---------- 2026-11-24 手机端自助听写投送与拍照秒批 ---------- */
  let lastDictBrief = null;
  let mobDictBusy = false;
  let mobDictUserToggled = false;

  window.toggleMobDictCard = (forceOpen) => {
    const body = $('mobDictBody'), btn = $('btnToggleMobDict');
    if (!body) return;
    mobDictUserToggled = true;
    const wantOpen = typeof forceOpen === 'boolean' ? forceOpen : body.classList.contains('collapsed');
    body.classList.toggle('collapsed', !wantOpen);
    if (btn) btn.textContent = wantOpen ? '收起 ▴' : '展开 ▾';
  };

  function exportMobDictJpegB64() {
    if (!baseCanvas) return '';
    if (userSelectedCrop && (crop.w < 0.92 || crop.h < 0.88)) {
      return exportCroppedJpegB64(420000);
    }
    return exportFullPageJpegB64(720000);
  }

  function renderMobDictPanel(dc) {
    const box = $('mobDictStatusBox');
    if (!box) return;
    if (!dc || !Number(dc.total_count)) {
      box.style.display = 'none';
      return;
    }
    if (!mobDictUserToggled && $('mobDictBody') && $('mobDictBody').classList.contains('collapsed')) {
      $('mobDictBody').classList.remove('collapsed');
      if ($('btnToggleMobDict')) $('btnToggleMobDict').textContent = '收起 ▴';
    }
    box.style.display = 'flex';
    const dis = mobDictBusy ? ' disabled' : '';
    if (dc.phase === 'graded') {
      const wrArr = Array.isArray(dc.wrong_items) ? dc.wrong_items : [];
      const wrCnt = (Number(dc.wrong_count) || 0) + (Number(dc.missing_count) || 0);
      box.innerHTML = `
        <div style="font-weight:700;color:var(--accent);">📝 听写批改完成：正确率 ${dc.accuracy_pct || 0}%（全对 ${dc.ok_count || 0}/${dc.total_count}）</div>
        <div>${escHtml(dc.summary || '')}</div>
        ${wrArr.map(w => `<div class="mob-dc-wrong">#${w.idx} 标准：${escHtml(w.word)}${w.written ? ` · 手写：「${escHtml(w.written)}」` : ' · 漏写'}${w.note ? `（${escHtml(w.note)}）` : ''}</div>`).join('')}
        <div class="mob-dc-grid">
          ${wrCnt > 0 ? `<button type="button" class="mob-dc-btn primary"${dis} onclick="mobDictCtl('retry_wrong')">🔁 大屏重默错词(${wrCnt})</button>` : ''}
          ${wrCnt > 0 ? `<button type="button" class="mob-dc-btn"${dis} onclick="mobDictCtl('enroll_mistakes')">📌 错词入错题本</button>` : ''}
        </div>`;
      return;
    }
    const prevWords = Array.isArray(dc.preview_words) && dc.preview_words.length ? `词表：${dc.preview_words.slice(0, 6).join('、')}${dc.total_count > 6 ? '…' : ''}` : '';
    box.innerHTML = `
      <div style="font-weight:700;">🎧 大屏当前词表：《${escHtml(dc.title || '自助听写')}》共 ${dc.total_count} 词（进度 ${(Number(dc.current_idx) || 0) + 1}/${dc.total_count}）</div>
      ${prevWords ? `<div style="color:var(--muted);font-size:13px;">${escHtml(prevWords)}</div>` : ''}
      <div class="mob-dc-grid">
        <button type="button" class="mob-dc-btn"${dis} onclick="mobDictCtl('open_ui')">🖥 大屏切到听写台</button>
        <button type="button" class="mob-dc-btn"${dis} onclick="mobDictCtl('clear')">🗑 清空大屏词表</button>
      </div>`;
  }

  window.mobStartDictText = async () => {
    const txt = ($('inpMobDictWords') ? $('inpMobDictWords').value : '').trim();
    if (!txt) {
      toast('请先在输入框粘贴或输入要听写的字词');
      return;
    }
    if (mobDictBusy) return;
    mobDictBusy = true;
    renderMobDictPanel(lastDictBrief);
    try {
      const iv = Number(($('selDictInterval') && $('selDictInterval').value) || 8);
      const em = ($('selDictEnMode') && $('selDictEnMode').value) || 'both';
      toast('🎧 正在投送听写词表到家里大屏…');
      const { r, j } = await postMobileJson({ action: 'dictation_start', words: txt, interval_sec: iv, en_mode: em }, 15000);
      if (r.ok && j && j.ok) {
        if ($('inpMobDictWords')) $('inpMobDictWords').value = '';
        if (j.dictation) { lastDictBrief = j.dictation; renderMobDictPanel(j.dictation); }
        toast(j.message || '已投送到家里大屏自助听写台！');
        pollMobileState();
      } else {
        toast((j && j.error) || '词表投送失败');
      }
    } catch (e) {
      toast('连接大屏超时，请确认 VPN 已连接');
    } finally {
      mobDictBusy = false;
      renderMobDictPanel(lastDictBrief);
    }
  };

  window.mobStartDictImage = async () => {
    if (!baseCanvas) {
      toast('请先在最上方「① 拍照或选作业图」拍一张课本词语表，再点此提取！');
      return;
    }
    if (mobDictBusy) return;
    mobDictBusy = true;
    renderMobDictPanel(lastDictBrief);
    try {
      const iv = Number(($('selDictInterval') && $('selDictInterval').value) || 8);
      const em = ($('selDictEnMode') && $('selDictEnMode').value) || 'both';
      const b64 = exportMobDictJpegB64();
      toast('📖 正在从课本照片提取听写词表并投送到大屏…');
      const { r, j } = await postMobileJson({ action: 'dictation_start', page_b64: b64, interval_sec: iv, en_mode: em }, 35000);
      if (r.ok && j && j.ok) {
        if (j.dictation) { lastDictBrief = j.dictation; renderMobDictPanel(j.dictation); }
        toast(j.message || '已提取词表并投送到大屏！');
        pollMobileState();
        if (j.pending) { setTimeout(pollMobileState, 3000); setTimeout(pollMobileState, 7000); }
      } else {
        toast((j && j.error) || '未能从图片提取词表');
      }
    } catch (e) {
      toast('提词超时，请重试');
    } finally {
      mobDictBusy = false;
      renderMobDictPanel(lastDictBrief);
    }
  };

  window.mobGradeDictImage = async () => {
    if (!lastDictBrief || !Number(lastDictBrief.total_count)) {
      toast('大屏当前还没有待批改的听写词表，请先投送词表完成听写哦');
      return;
    }
    if (!baseCanvas) {
      toast('请先在最上方「① 拍照或选作业图」拍一张孩子写好的听写本，再点此秒批！');
      return;
    }
    if (mobDictBusy) return;
    mobDictBusy = true;
    renderMobDictPanel(lastDictBrief);
    try {
      const b64 = exportMobDictJpegB64();
      toast('📸 正在上传听写本照片并逐字核对笔画与拼写…');
      const { r, j } = await postMobileJson({ action: 'dictation_grade', page_b64: b64 }, 38000);
      if (r.ok && j && j.ok) {
        if (j.dictation) { lastDictBrief = j.dictation; renderMobDictPanel(j.dictation); }
        toast(j.message || '听写本批改完成！');
        pollMobileState();
        if (j.pending) { setTimeout(pollMobileState, 3500); setTimeout(pollMobileState, 7500); }
      } else {
        toast((j && j.error) || '听写本批改未成功');
      }
    } catch (e) {
      toast('批改请求超时，请重试');
    } finally {
      mobDictBusy = false;
      renderMobDictPanel(lastDictBrief);
    }
  };

  window.mobDictCtl = async (subAct) => {
    if (mobDictBusy) return;
    mobDictBusy = true;
    renderMobDictPanel(lastDictBrief);
    try {
      const { r, j } = await postMobileJson({ action: 'dictation_ctl', sub_action: subAct }, 12000);
      if (r.ok && j && j.ok) {
        if (j.dictation) { lastDictBrief = j.dictation; renderMobDictPanel(j.dictation); }
        toast(j.message || '操作已生效');
        pollMobileState();
      } else {
        toast((j && j.error) || '操作未成功');
      }
    } catch (e) {
      toast('连接大屏超时');
    } finally {
      mobDictBusy = false;
      renderMobDictPanel(lastDictBrief);
    }
  };

  window.addEventListener('pagehide', (ev) => {
    if (mobPollTimer) { clearInterval(mobPollTimer); mobPollTimer = null; }
    if (typeof abortStageSilent === 'function') abortStageSilent();
    _cancelPrintReq();
    if (!ev || !ev.persisted) closePrintSheetModal();
  });
  window.addEventListener('pageshow', (ev) => {
    if (ev && ev.persisted) {
      syncMobPollTimer();
      if (embedActive && !document.hidden) pollMobileState();
    }
  });

  pollMobileState();
  syncMobPollTimer();
})();
</script>
</body>
</html>
