# 2026-11-04 (Claude): ThinkSmart local changes to xiaozhi-hub-server live OUTSIDE its git checkout so
# the hub updater never reports modified files. sitecustomize.py in this directory swaps in our copies
# only while the official files are unchanged; see its header and /run/user/1000/xiaozhi-hub-overrides.json
[Service]
Environment="PYTHONPATH=/opt/thinksmart-addons/xiaozhi-hub-overrides"
UMask=0077
