# 2026-11-04: NetworkManager never reports "startup complete" on this device, so the stock
# "nm-online -s" always ran into its 60 s timeout and delayed every service ordered after
# network-online.target (thinksmart-client, qqmusic, intercom tunnel) by ~55 s at boot.
# Wait for an actual connection instead (Wi-Fi is up ~20 s after boot).
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q -t 60
