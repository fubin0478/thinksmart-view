<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>已并入 ThinkSmart 统一管理后台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(720px 420px at 50% 18%, #182754 0%, #090e1e 72%);
    color: #eef3ff; font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  }
  .card {
    width: min(520px, 100%); padding: 32px 30px; border-radius: 22px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 52px rgba(0, 0, 0, 0.42); text-align: center;
  }
  .badge {
    display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    color: #8ce9ff; background: rgba(94, 224, 255, 0.14); border: 1px solid rgba(94, 224, 255, 0.3);
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
  p { margin: 0 0 24px; font-size: 15px; line-height: 1.65; color: #b5c1e4; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px;
    border-radius: 14px; background: linear-gradient(135deg, #5b7fff, #3cc8ff); color: #fff;
    font-size: 16px; font-weight: 700; text-decoration: none;
  }
  .sub { margin-top: 16px; font-size: 13px; color: #7e8bb4; font-family: monospace; }
</style>
</head>
<body>
  <div class="card" id="tsUnifiedBanner">
    <div class="badge">ThinkSmart View · 全栈自主系统</div>
    <h1>管理入口已统一合并</h1>
    <p>原语音网关独立后台已整体并入 ThinkSmart 统一管理中心（大模型、语音、音乐、监控、伴学、AI 讲题一站式管控），正在为您自动跳转…</p>
    <a class="btn" id="goBtn" href="/admin/">立即进入统一管理后台</a>
    <div class="sub" id="targetUrl"></div>
  </div>
  <script>
    (function () {
      var hn = location.hostname || '127.0.0.1';
      var hostPart = hn.indexOf(':') >= 0 && hn[0] !== '[' ? '[' + hn + ']' : hn;
      var target = 'http://' + hostPart + ':18091/admin/';
      document.getElementById('goBtn').href = target;
      document.getElementById('targetUrl').textContent = target;
      if (!/[?&]stay=1\b/.test(location.search)) {
        setTimeout(function () { location.replace(target); }, 350);
      }
    })();
  </script>
</body>
</html>
