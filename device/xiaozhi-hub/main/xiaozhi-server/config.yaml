# 在开发中，请在项目根目录创建data目录，然后在data目录创建名称为【.config.yaml】的空文件
# 然后你想修改覆盖修改什么配置，就修改【.config.yaml】文件，而不是修改【config.yaml】文件
# 系统会优先读取【data/.config.yaml】文件的配置，如果【.config.yaml】文件里的配置不存在，系统会自动去读取【config.yaml】文件的配置。
# 这样做，可以最简化配置，保护您的密钥安全。
# 如果你使用了智控台，那么以下所有配置，都不会生效，请在智控台中修改配置

# #####################################################################################
# #############################以下是服务器基本运行配置####################################
server:
  ip: 127.0.0.1
  port: 8000
  http_port: 8003
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  timezone_offset: +8
  auth:
    enabled: false
    allowed_devices: []
log:
  # 设置控制台输出的日志格式，时间、日志级别、标签、消息
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # 设置日志文件输出的格式，时间、日志级别、标签、消息
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # 设置日志等级：INFO、DEBUG
  log_level: INFO
  # 设置日志路径
  log_dir: tmp
  # 设置日志文件
  log_file: "server.log"
  # 设置数据文件路径
  data_dir: data

# 使用完声音文件后删除文件(Delete the sound file when you are done using it)
delete_audio: true
# 没有语音输入多久后断开连接(秒)，默认2分钟，即120秒
close_connection_no_voice_time: 120

# [xiaozhi-hub] 聊天记录落盘（data/chat.db，按设备和模型存，网关重启、断开后还在），见 core/agent/chat_history.py
chat_history:
  enabled: true
  # 普通 API 模型每次最多带最近这么多条（用户、助手、工具消息都算），再加一道 token 上限（估算）。
  # 工具调用和它的结果不会被拆开。Claude Code 的上下文在它自己的会话里，只存记录给屏幕显示
  max_messages: 30
  max_tokens: 8000
  # 截掉的旧对话在后台总结成记忆，放进系统提示的 <memory>；攒够 summary_min 条才总结一次。
  # 记忆每台设备一份，所有普通 API 模型共用；管理后台"记忆"页可以查看、修改、清空
  summary: true
  summary_min: 6
  summary_chars: 500
  # 总结用哪个 LLM 条目，留空用当前这个模型
  summary_llm: ""
  # 给屏幕显示时每个模型最多返回多少条
  display_limit: 100
# TTS请求超时时间(秒)
tts_timeout: 15
# 工具调用超时时间(秒)
tool_call_timeout: 30
# 开启唤醒词加速
enable_wakeup_words_response_cache: true
# 开场是否回复唤醒词
enable_greeting: true
# 说完话是否开启提示音
enable_stop_tts_notify: false
# 说完话是否开启提示音，音效地址
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# 是否启用WebSocket心跳保活机制
enable_websocket_ping: false


# TTS音频发送延迟配置
# tts_audio_send_delay: 控制音频包发送间隔
#   0: 使用精确时间控制，严格匹配音频帧率（默认，运行时按音频帧率计算）
#   > 0: 使用固定延迟（毫秒）发送，例如: 60
tts_audio_send_delay: 0

exit_commands:
  - "退出"
  - "关闭"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus支持的采样率范围为[8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# 模块测试配置
module_test:
  test_sentences:
    - "你好，请介绍一下你自己"
    - "What's the weather like today?"
    - "请用100字概括量子计算的基本原理和应用前景"

# 唤醒词，用于识别唤醒词还是讲话内容
wakeup_words:
  - "你好小智"
  - "小麦小麦"
  - "哈喽小麦"
  - "小麦同学"
  - "嘿你好呀"

# 插件的基础配置
plugins:
  # 查天气插件：用 Open-Meteo（天气、空气质量）和 OpenStreetMap Nominatim（地名），免费、不用 Key
  # 所在地可以在后台「意图识别」页查天气旁边的「设置」里填
  get_weather:
    # 所在地，可以写到区县，例如 深圳南山区；留空按宽带公网 IP 判断城市
    location: ""
    # 所在地没填、IP 也判断不出来时用的城市
    default_location: "广州"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社"
  play_music:
    music_dir: "./music"  # 音乐文件存放路径，将从该目录及子目录下搜索音乐文件
    music_ext: # 音乐文件类型，p3格式效率最高
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # 刷新音乐列表的时间间隔，单位为秒
  # 联网搜索插件配置（后台「意图识别」页的联网搜索旁边可以设置和测试）
  # 向 Anthropic 协议的接口发请求，用接口自带的搜索工具（web_search_20250305）搜，
  # 需要支持自带搜索的接口，例如 DeepSeek（https://api.deepseek.com/anthropic/v1）、Anthropic 官方（https://api.anthropic.com）。
  # 聊天模型和这里无关，用哪家都可以。
  web_search:
    # 工具描述，用于告知LLM何时调用此工具，可根据需要自定义
    description: "联网搜索工具。用户问到实时信息、最近发生的事、新闻、价格、比分，或者你不确定、需要查证的事实时使用。"
    # 接口地址：写到 /anthropic 或 /anthropic/v1 都可以
    base_url: "https://api.deepseek.com/anthropic/v1"
    # API Key
    api_key: "你的api_key"
    # 搜索用的模型
    model: "deepseek-v4-flash"
    # 单次最多搜索几次（1-10）
    max_uses: 5

# #####################################################################################
# ################################以下是角色模型配置######################################

# [xiaozhi-hub] 默认改用中性小麦人设和本项目的提示词模板（不按 IP 查位置和天气）。
prompt: |
  你叫小麦，是一个简洁、友好的语音助手，通过一个小小的语音设备和用户聊天、回答问题、帮忙做事。
  说话自然口语化，像一个靠谱的朋友；直接回答问题，不绕弯子，不长篇大论。

# 默认系统提示词模板文件
prompt_template: hub-base-prompt.txt

# 系统错误时的回复
# [xiaozhi-hub] 原为"主人，小智现在有点忙，我们稍后再试吧。"，和中性人设保持一致
system_error_response: "现在有点忙，我们稍后再试吧。"

# 结束语prompt
end_prompt:
  enable: true # 是否开启结束语
  # [xiaozhi-hub] 固定告别语：填写后直接说这句再断开，不再让大模型按下面的 prompt 生成
  reply: 好一会儿没听到你说话，我先休息啦，有事再叫我。
  # 结束语
  prompt: |
    请你以"时间过得真快"未来头，用富有感情、依依不舍的话来结束这场对话吧！

# 具体处理时选择的模块(The module selected for specific processing)
selected_module:
  VAD: SileroVAD
  ASR: SherpaXASR
  LLM: ChatGLMLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

Intent:
  nointent:
    type: nointent
  function_call:
    type: function_call
    functions:
      - change_role
      - web_search                  # 联网搜索
      - get_weather
      - get_news_from_newsnow
      - play_music

Memory:
  nomem:
    type: nomem

ASR:
  # [xiaozhi-hub] 本项目默认的语音识别：X-ASR 中英混合模型（约 175MB），需要 sherpa-onnx 1.13 以上
  SherpaXASR:
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-x-asr-zipformer-transducer-zh-en-punct-int8-2026-06-03
    output_dir: tmp/
    model_type: transducer
    num_threads: 4
    segment_pause_ms: 300
  DoubaoStreamASR:
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: volc.bigasr.sauc.duration
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    enable_multilingual: False
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    api_key: 你的火山引擎新版控制台API Key
    resource_id: volc.seedasr.sauc.duration
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    enable_multilingual: False
    end_window_size: 200
    output_dir: tmp/
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 650

LLM:
  AliLLM:
    type: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen-flash
    api_key: 你的deepseek web key
    temperature: 0.7
    max_tokens: 500
    top_p: 1
    frequency_penalty: 0
  DoubaoLLM:
    type: openai
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: doubao-seed-2-0-lite-260215
    api_key: 你的doubao web key
  DeepSeekLLM:
    type: openai
    model_name: deepseek-v4-flash
    url: https://api.deepseek.com
    api_key: 你的deepseek web key
  ChatGLMLLM:
    type: openai
    model_name: glm-4-flash
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: 你的chat-glm web key
  ClaudeAPI:
    type: openai
    base_url: https://api.anthropic.com/v1/
    model_name: claude-haiku-5-5
    api_key: 你的claude web key
  OpenAILLM:
    type: openai
    base_url: https://api.openai.com/v1
    model_name: gpt-5-mini
    api_key: 你的openai web key
  KimiLLM:
    type: openai
    base_url: https://api.moonshot.cn/v1
    model_name: kimi-latest
    api_key: 你的kimi web key
  CustomOpenAILLM:
    type: openai
    base_url: http://127.0.0.1:11434/v1
    model_name: ""
    api_key: ""
TTS:
  EdgeTTS:
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    volume: "+50"
    output_dir: tmp/
  OpenAITTS:
    type: openai
    api_key: 你的openai api key
    api_url: https://api.openai.com/v1/audio/speech
    model: tts-1
    voice: onyx
    speed: 1
    output_dir: tmp/
  IndexStreamTTS:
    type: index_stream
    api_url: http://127.0.0.1:11996/tts
    audio_format: "pcm"
    voice: "jay_klee"
    output_dir: tmp/
